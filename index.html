    }

<body>
  <main class="wrap">
    <section class="card">
      <div class="hero">
        <img src="hamster.jpg" alt="鼠鼠艳照">
        <div class="hero-badge">鼠鼠艳照 · ¥0.10</div>
      </div>

      <div class="content">
        <div class="topline">
          <h1>鼠鼠艳照</h1>
          <div class="price">¥0.10</div>
        </div>

        <p class="desc">
          支付 0.1 元即可购买一张可爱鼠鼠照片。
         1元可购买一段可爱鼠鼠视频😊
        </p>

          <div class="pay-title">微信扫码支付 ¥0.10</div>
          <p class="pay-sub">长按保存 / 使用另一台设备扫码</p>
          <img src="wechat-pay.jpg" alt="微信收款码">
          <div class="tip">支付后凭付款记录领取照片。</div>
        </section>

        <div class="share-row">
          <button class="share-btn" onclick="sharePage()">分享给好友</button>
          <button class="copy-btn" onclick="copyLink()">复制链接</button>
        </div>

    </section>
    <div class="foot">Digital photo · ¥0.10</div>
  </main>

<script>
  const SHARE_URL = "https://lipeanny.github.io/mouse-photo-shop/";

  async function sharePage() {
    const shareData = {
      title: "0.1元购买鼠鼠艳照",
      text: "只要0.1元，带可爱鼠鼠回家。",
      url: SHARE_URL
    };

    if (navigator.share) {
      try {
        await navigator.share(shareData);
      } catch (err) {
        // 用户取消分享时不做处理
      }
    } else {
      try {
        await navigator.clipboard.writeText(SHARE_URL);
        alert("当前浏览器不支持系统分享，链接已复制。请打开 QQ 后粘贴发送。");
      } catch (err) {
        prompt("复制下面的链接并发送到 QQ：", SHARE_URL);
      }
    }
  }

  async function copyLink() {
    try {
      await navigator.clipboard.writeText(SHARE_URL);
      alert("链接已复制");
    } catch (err) {
      prompt("请复制下面的链接：", SHARE_URL);
    }
  }
</script>
